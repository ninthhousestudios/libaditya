[project]
name = "libaditya"
version = "0.4.2"
description = "Astrological calculation library for Adityas. It is capable of calculating using tropical zodiac, tropical adityas, or sidereal signs. It can do any ayanamsa for naskhatras, including tropcial/sidereal nakshatras, or both sidereal or both tropical (right now, Vedanga Jyotisha ayanamsa). It has basic HD calculations in it; will include more soon. see README for more information on trying it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "more-itertools>=10.8.0",
    "pyswisseph>=2.10.3.2",
    "toml>=0.10.2",
]

[project.optional-dependencies]
# terminal tables: the print_functions module and every .print()/.rich() method
print = [
    "prettytable>=3.17.0",
    "rich>=14.3.2",
]
# SVG drawing: Chart().bodygraph().draw_svg() and the sarvatobhadra chakra
draw = [
    "drawsvg>=2.4.1",
]
# METAR weather lookup on Location
weather = [
    "metar>=1.11.0",
]
# driving a running stellarium instance (RemoteControl plugin http server)
stellarium = [
    "requests>=2.32.5",
]
all = [
    "libaditya[print,draw,weather,stellarium]",
]

[project.urls]
Homepage = "https://github.com/ninthhousestudios/libaditya"
Repository = "https://github.com/ninthhousestudios/libaditya"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "libaditya"
]
exclude = [
#  "*.json",
#  "pkg/_compat.py",
]


[tool.uv.workspace]
members = [
    ".",
    ".",
]

[tool.uv.sources]
libaditya = { workspace = true }

[dependency-groups]
dev = [
    "libaditya[all]",
    "pytest>=9.1.1",
]
